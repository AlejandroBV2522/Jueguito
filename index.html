<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Solo se permite cargar archivos de este mismo proyecto: nada de terceros. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
    <title>Camino a Celaque</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="config.js"></script>
    <script defer src="main.js"></script>
</head>
<body>
    <canvas id="juego" aria-label="Juego Camino a Celaque"></canvas>

    <!-- Barra de progreso -->
    <div id="hud" hidden>
        <div class="hud-barra"><div id="hud-relleno"></div></div>
        <p id="hud-texto"></p>
    </div>

    <!-- Caja de diálogo (el texto se llena desde config.js) -->
    <div id="dialogo" hidden>
        <div id="dialogo-retrato"></div>
        <div class="dialogo-cuerpo">
            <p id="dialogo-nombre"></p>
            <p id="dialogo-texto"></p>
            <p id="dialogo-pista"></p>
        </div>
    </div>

    <!-- Pantalla de inicio -->
    <div id="pantalla-inicio" class="pantalla">
        <h1 id="titulo"></h1>
        <p id="subtitulo"></p>
        <div id="selector" role="radiogroup" aria-label="Elige tu personaje">
            <button class="opcion" data-personaje="chico" role="radio"><canvas></canvas><span></span></button>
            <button class="opcion" data-personaje="chica" role="radio"><canvas></canvas><span></span></button>
        </div>
        <button id="btn-comenzar" class="boton">Comenzar</button>
        <p class="ayuda">Camina con ← → (o A / D, o la rueda del mouse). Mantén Q para correr.<br>Habla y avanza los diálogos con E, Enter o Espacio.</p>
    </div>

    <!-- Pantalla de victoria -->
    <div id="pantalla-victoria" class="pantalla" hidden>
        <h1 id="victoria-titulo"></h1>
        <p id="victoria-texto"></p>
        <div class="botones">
            <button id="btn-reiniciar" class="boton">Jugar de nuevo</button>
            <button id="btn-cambiar" class="boton boton-secundario">Cambiar personaje</button>
        </div>
    </div>

    <!-- Controles táctiles (solo se ven en celulares y tablets) -->
    <div id="controles-tactiles" hidden>
        <div class="grupo">
            <button id="btn-izq" class="tactil" aria-label="Caminar a la izquierda">◀</button>
            <button id="btn-der" class="tactil" aria-label="Caminar a la derecha">▶</button>
        </div>
        <div class="grupo">
            <button id="btn-correr" class="tactil texto" aria-label="Correr">Correr</button>
            <button id="btn-hablar" class="tactil texto" aria-label="Hablar">Hablar</button>
        </div>
    </div>
</body>
</html>
