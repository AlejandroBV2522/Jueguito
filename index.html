<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Solo se permite cargar archivos de este mismo proyecto: nada de terceros. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
    <title>Camino a Celaque</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="config.js"></script>
    <script defer src="main.js"></script>
</head>
<body>
    <canvas id="juego" aria-label="Juego Camino a Celaque"></canvas>

    <!-- Barra de progreso -->
    <div id="hud" hidden>
        <div class="hud-barra"><div id="hud-relleno"></div></div>
        <p id="hud-texto"></p>
    </div>

    <!-- Barrita del jugador: su nombre, su cara y sus corazones -->
    <div id="barra-jugador" hidden>
        <canvas id="cara-jugador" aria-hidden="true"></canvas>
        <div class="barra-jugador-datos">
            <p id="barra-nombre"></p>
            <canvas id="corazones-jugador" aria-hidden="true"></canvas>
        </div>
    </div>

    <!-- Caja de diálogo (el texto se llena desde config.js) -->
    <div id="dialogo" hidden>
        <div id="dialogo-retrato"></div>
        <div class="dialogo-cuerpo">
            <p id="dialogo-nombre"></p>
            <p id="dialogo-texto"></p>
            <div id="dialogo-opciones" class="dialogo-opciones" hidden></div>
            <p id="dialogo-pista"></p>
        </div>
    </div>

    <!-- Terminal Celaque: la computadora del fondo de cada oficina (módulo) -->
    <div id="terminal" hidden>
        <div class="monitor">
            <div class="pantalla-pc">
                <div class="barra-pc">
                    <div class="espacio-logo logo-pc" data-logo="assets/logos/celaque-horizontal-blanco.png" role="img" aria-label="Celaque">LOGO</div>
                    <span id="terminal-titulo"></span>
                    <span id="terminal-progreso"></span>
                </div>
                <div class="cuerpo-pc">
                    <p id="terminal-pregunta"></p>
                    <div id="terminal-opciones"></div>
                    <p id="terminal-pista"></p>
                    <button id="terminal-salir" class="boton boton-grande" hidden>Volver al mapa <span class="boton-icono" aria-hidden="true">▶</span></button>
                </div>
            </div>
        </div>
        <div class="pie-monitor"></div>
    </div>

    <!-- Mapa: rectángulo del centro, donde se elige el personaje -->
    <div id="mapa-panel">
        <div class="espacio-logo logo-celaque" data-logo="assets/logos/celaque-horizontal-verde-profundo.png" role="img" aria-label="Celaque">LOGO</div>
        <h1 id="titulo"></h1>
        <p id="subtitulo"></p>
        <div id="selector" role="radiogroup" aria-label="Elige tu personaje">
            <button class="opcion" data-personaje="chico" role="radio"><canvas></canvas><span></span></button>
            <button class="opcion" data-personaje="chica" role="radio"><canvas></canvas><span></span></button>
        </div>
        <label id="nombre-etiqueta" class="campo-nombre" for="nombre-jugador">
            <span id="nombre-pregunta"></span>
            <input id="nombre-jugador" type="text" maxlength="24" autocomplete="off" spellcheck="false" placeholder="Escribe tu nombre">
        </label>
    </div>

    <!-- Empezar de cero: borra el progreso guardado en este navegador -->
    <button id="btn-reiniciar-progreso" class="boton boton-secundario boton-chico" aria-label="Empezar de cero (borra el progreso)">↻ Empezar de cero</button>

    <!-- Mapa acercado a un mundo -->
    <div id="mapa-barra" hidden>
        <button id="btn-mapa-volver" class="boton boton-secundario boton-chico">◀ Mapa</button>
        <p id="mapa-barra-texto"></p>
    </div>

    <!-- Teclas del mapa (solo con teclado) -->
    <div id="mapa-ayuda" class="ayuda" aria-label="Controles">
        <span class="tecla-ayuda"><kbd>←</kbd><kbd>→</kbd> Elegir mundo</span>
        <span class="tecla-ayuda"><kbd>Enter</kbd> Acercar / ver carta</span>
        <span class="tecla-ayuda"><kbd>Esc</kbd> Volver</span>
        <span class="tecla-ayuda separador">En el nivel:</span>
        <span class="tecla-ayuda"><kbd>Espacio</kbd> Saltar</span>
        <span class="tecla-ayuda"><kbd>Q</kbd> Correr</span>
        <span class="tecla-ayuda"><kbd>E</kbd> Hablar</span>
    </div>

    <!-- Carta de cada mundo: qué sistema es y entrada al nivel -->
    <div id="carta" hidden role="dialog" aria-modal="true" aria-labelledby="carta-titulo">
        <div class="carta">
            <div class="carta-cabeza">
                <div id="carta-logo" class="espacio-logo logo-carta" role="img" aria-label="Logo del módulo">LOGO</div>
                <div>
                    <p id="carta-mundo"></p>
                    <h2 id="carta-titulo"></h2>
                    <p id="carta-modulo"></p>
                </div>
            </div>
            <p id="carta-descripcion"></p>
            <ul id="carta-lista"></ul>
            <div class="botones">
                <button id="carta-entrar" class="boton boton-grande"><span id="carta-entrar-texto">Entrar</span> <span class="boton-icono" aria-hidden="true">▶</span></button>
                <button id="carta-volver" class="boton boton-secundario">Volver</button>
            </div>
        </div>
    </div>

    <!-- Final: bienvenida con el nombre del jugador -->
    <div id="pantalla-victoria" hidden>
        <div class="tarjeta-final" role="dialog" aria-labelledby="victoria-bienvenida">
            <div class="cinta-final" aria-hidden="true"></div>
            <div class="espacio-logo logo-celaque" data-logo="assets/logos/celaque-horizontal-verde-profundo.png" role="img" aria-label="Celaque">LOGO</div>
            <p id="victoria-titulo" class="final-pre"></p>
            <h1 id="victoria-bienvenida"></h1>
            <p id="victoria-nombre" class="final-nombre"></p>
            <p id="victoria-texto"></p>
            <ul id="victoria-modulos" class="final-modulos"></ul>
            <p class="lema">Tú lo sueñas, juntos lo construimos.</p>
            <p id="victoria-fecha" class="final-fecha"></p>
            <div class="botones">
                <button id="btn-reiniciar" class="boton boton-grande">Jugar de nuevo <span class="boton-icono" aria-hidden="true">↻</span></button>
                <button id="btn-cambiar" class="boton boton-secundario">Ver el mapa</button>
            </div>
        </div>
    </div>

    <!-- Controles táctiles (solo se ven en celulares y tablets) -->
    <div id="controles-tactiles" hidden>
        <div class="grupo">
            <button id="btn-izq" class="tactil" aria-label="Caminar a la izquierda">◀</button>
            <button id="btn-der" class="tactil" aria-label="Caminar a la derecha">▶</button>
        </div>
        <div class="grupo">
            <button id="btn-correr" class="tactil texto" aria-label="Correr">Correr</button>
            <button id="btn-hablar" class="tactil texto" aria-label="Hablar o entrar">Hablar</button>
            <button id="btn-saltar" class="tactil texto" aria-label="Saltar">Saltar</button>
            <button id="btn-agachar" class="tactil texto" aria-label="Agachar">Agachar</button>
        </div>
    </div>
</body>
</html>
